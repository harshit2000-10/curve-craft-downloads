name: release

# Builds the Curve Craft desktop app for macOS and Windows and attaches the
# installers to a draft GitHub Release. Windows can't be built on this repo's
# dev machine (a Mac), so CI is the only way to produce a .msi without owning
# a Windows box — macos-latest/windows-latest give each build its native OS.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest]

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - name: install frontend dependencies
        working-directory: frontend
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: frontend
          tagName: app-v__VERSION__
          releaseName: "Curve Craft v__VERSION__"
          releaseBody: "Desktop build for macOS and Windows. Unsigned — macOS: right-click the app > Open. Windows: click 'More info' > 'Run anyway' on the SmartScreen prompt."
          releaseDraft: true
          prerelease: false
