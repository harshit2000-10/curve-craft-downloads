document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

4,108,248,0.2); display:flex; align-items:center; justify-content:center; margin-bottom:22px;\">\n          <svg width=\"26\" height=\"26\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M4 19V5m0 14h16M8 15l3-4 3 2 4-6\" stroke=\"#9d7cff\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n        <\u002Fdiv>\n        <h3 data-chars=\"true\" style=\"font-family:'Space Grotesk',sans-serif; font-size:22px; font-weight:700; margin:0 0 12px; cursor:default;\">12+ chart types<\u002Fh3>\n        <p style=\"font-size:15.5px; line-height:1.6; color:#a9a8c4; margin:0 0 22px;\">Line, bar, scatter, area, stacked, donut and more — switch between them with a click and your data stays mapped.<\u002Fp>\n        <div style=\"display:flex; gap:10px; flex-wrap:wrap;\">\n          <span style=\"font-size:12.5px; padding:6px 12px; border-radius:8px; background:rgba(255,255,255,0.06); color:#cfceea;\">Line<\u002Fspan>\n          <span style=\"font-size:12.5px; padding:6px 12px; border-radius:8px; background:rgba(255,255,255,0.06); color:#cfceea;\">Bar<\u002Fspan>\n          <span style=\"font-size:12.5px; padding:6px 12px; border-radius:8px; background:rgba(255,255,255,0.06); color:#cfceea;\">Scatter<\u002Fspan>\n          <span style=\"font-size:12.5px; padding:6px 12px; border-radius:8px; background:rgba(255,255,255,0.06); color:#cfceea;\">Area<\u002Fspan>\n          <span style=\"font-size:12.5px; padding:6px 12px; border-radius:8px; background:rgba(255,255,255,0.06); color:#cfceea;\">Donut<\u002Fspan>\n          <span style=\"font-size:12.5px; padding:6px 12px; border-radius:8px; background:rgba(94,234,212,0.12); color:#5eead4;\">+7 more<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"reveal feat-card feat-card-teal\" data-tilt=\"\" style=\"padding:30px; border-radius:20px; background:linear-gradient(165deg,rgba(94,234,212,0.12),rgba(20,18,38,0.6)); border:1px solid rgba(94,234,212,0.2); box-shadow:0 18px 50px rgba(0,0,0,0.34);\">\n        <div class=\"feat-icon\" style=\"width:50px; height:50px; border-radius:14px; background:rgba(94,234,212,0.16); display:flex; align-items:center; justify-content:center; margin-bottom:20px;\">\n          <svg width=\"26\" height=\"26\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M12 2l8 4v5c0 5-3.4 8.5-8 11-4.6-2.5-8-6-8-11V6l8-4z\" stroke=\"#5eead4\" stroke-width=\"2.1\" stroke-linejoin=\"round\"><\u002Fpath><path d=\"M9 12l2 2 4-4\" stroke=\"#5eead4\" stroke-width=\"2.1\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n        <\u002Fdiv>\n        <h3 data-chars=\"true\" style=\"font-family:'Space Grotesk',sans-serif; font-size:20px; font-weight:700; margin:0 0 10px; cursor:default;\">Private by design<\u002Fh3>\n        <p style=\"font-size:15px; line-height:1.6; color:#a9a8c4; margin:0;\">Everything runs in your browser. No uploads, no accounts, no tracking — your spreadsheet never leaves the tab.<\u002Fp>\n      <\u002Fdiv>\n\n      <div class=\"reveal feat-card feat-card-pink\" data-tilt=\"\" style=\"padding:30px; border-radius:20px; background:linear-gradient(165deg,rgba(255,124,201,0.10),rgba(20,18,38,0.6)); border:1px solid rgba(255,124,201,0.18); box-shadow:0 18px 50px rgba(0,0,0,0.34);\">\n        <div class=\"feat-icon\" style=\"width:50px; height:50px; border-radius:14px; background:rgba(255,124,201,0.14); display:flex; align-items:center; justify-content:center; margin-bottom:20px;\">\n          <svg width=\"26\" height=\"26\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M13 2L4 14h6l-1 8 9-12h-6l1-8z\" stroke=\"#ff9dd6\" stroke-width=\"2.1\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n        <\u002Fdiv>\n        <h3 data-chars=\"true\" style=\"font-family:'Space Grotesk',sans-serif; font-size:20px; font-weight:700; margin:0 0 10px; cursor:default;\">Instant rendering<\u002Fh3>\n        <p style=\"font-size:15px; line-height:1.6; color:#a9a8c4; margin:0;\">Paste or drop a CSV and watch it become a chart in about two seconds. No loading spinners, no waiting.<\u002Fp>\n      <\u002Fdiv>\n\n      <div class=\"reveal feat-card feat-card-neutral\" data-tilt=\"\" style=\"grid-column:span 2; padding:30px; border-radius:20px; background:linear-gradient(110deg,rgba(124,108,248,0.12),rgba(20,18,38,0.6)); border:1px solid rgba(255,255,255,0.1); box-shadow:0 18px 50px rgba(0,0,0,0.34); display:flex; align-items:center; gap:26px;\">\n        <div style=\"flex:1;\">\n          <h3 data-chars=\"true\" style=\"font-family:'Space Grotesk',sans-serif; font-size:20px; font-weight:700; margin:0 0 10px; cursor:default;\">Export anywhere<\u002Fh3>\n          <p style=\"font-size:15px; line-height:1.6; color:#a9a8c4; margin:0;\">Download as crisp SVG or high-resolution PNG, ready for papers, decks and dashboards.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"display:flex; gap:12px;\">\n          <div style=\"padding:14px 20px; border-radius:12px; border:1px solid rgba(124,108,248,0.3); background:rgba(124,108,248,0.08); font-family:'Space Grotesk',sans-serif; font-weight:700; color:#c9c2ff;\">SVG<\u002Fdiv>\n          <div style=\"padding:14px 20px; border-radius:12px; border:1px solid rgba(94,234,212,0.3); background:rgba(94,234,212,0.08); font-family:'Space Grotesk',sans-serif; font-weight:700; color:#5eead4;\">PNG<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- HOW IT WORKS -->\n  <section id=\"how\" style=\"position:relative; z-index:1; padding:80px 64px; max-width:1240px; margin:0 auto;\">\n    <div class=\"reveal\" style=\"text-align:center; margin-bottom:58px;\">\n      <div style=\"font-size:13px; letter-spacing:0.18em; text-transform:uppercase; color:#5eead4; font-weight:600; margin-bottom:14px;\">Three steps<\u002Fdiv>\n      <h2 data-chars=\"true\" style=\"font-family:'Space Grotesk',sans-serif; font-size:clamp(30px,3.6vw,46px); font-weight:700; letter-spacing:-0.02em; margin:0; cursor:default;\">From spreadsheet to chart<\u002Fh2>\n    <\u002Fdiv>\n    <div style=\"display:grid; grid-template-columns:repeat(3,1fr); gap:24px; position:relative;\">\n      <div style=\"position:absolute; top:36px; left:16%; right:16%; height:2px; background:linear-gradient(90deg,transparent,rgba(124,108,248,0.4),rgba(94,234,212,0.4),transparent); z-index:0;\"><\u002Fdiv>\n      <div class=\"reveal\" style=\"position:relative; z-index:1; text-align:center;\">\n        <div data-flip=\"true\" style=\"width:72px; height:72px; margin:0 auto 22px; border-radius:20px; background:linear-gradient(135deg,#7c6cf8,#9d7cff); display:flex; align-items:center; justify-content:center; font-family:'Space Grotesk',sans-serif; font-size:28px; font-weight:700; color:#07070d; box-shadow:0 0 30px rgba(124,108,248,0.5); cursor:default;\">1<\u002Fdiv>\n        <h3 data-chars=\"true\" style=\"font-family:'Space Grotesk',sans-serif; font-size:21px; font-weight:700; margin:0 0 10px; cursor:default;\">Drop your CSV<\u002Fh3>\n        <p style=\"font-size:15px; line-height:1.6; color:#a9a8c4; margin:0; max-width:300px; margin-inline:auto;\">Drag a file in or paste raw data. Columns are detected automatically.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"reveal\" style=\"position:relative; z-index:1; text-align:center;\">\n        <div data-flip=\"true\" style=\"width:72px; height:72px; margin:0 auto 22px; border-radius:20px; background:linear-gradient(135deg,#6f8bff,#5eead4); display:flex; align-items:center; justify-content:center; font-family:'Space Grotesk',sans-serif; font-size:28px; font-weight:700; color:#07070d; box-shadow:0 0 30px rgba(94,234,212,0.4); cursor:default;\">2<\u002Fdiv>\n        <h3 data-chars=\"true\" style=\"font-family:'Space Grotesk',sans-serif; font-size:21px; font-weight:700; margin:0 0 10px; cursor:default;\">Pick &amp; tune<\u002Fh3>\n        <p style=\"font-size:15px; line-height:1.6; color:#a9a8c4; margin:0; max-width:300px; margin-inline:auto;\">Choose a chart type, map axes, then tweak colors, labels and scale.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"reveal\" style=\"position:relative; z-index:1; text-align:center;\">\n        <div data-flip=\"true\" style=\"width:72px; height:72px; margin:0 auto 22px; border-radius:20px; background:linear-gradient(135deg,#5eead4,#a0ffd6); display:flex; align-items:center; justify-content:center; font-family:'Space Grotesk',sans-serif; font-size:28px; font-weight:700; color:#07070d; box-shadow:0 0 30px rgba(94,234,212,0.4); cursor:default;\">3<\u002Fdiv>\n        <h3 data-chars=\"true\" style=\"font-family:'Space Grotesk',sans-serif; font-size:21px; font-weight:700; margin:0 0 10px; cursor:default;\">Export &amp; share<\u002Fh3>\n        <p style=\"font-size:15px; line-height:1.6; color:#a9a8c4; margin:0; max-width:300px; margin-inline:auto;\">Download a publication-ready SVG or PNG and drop it anywhere.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- DEMO SHOWCASE -->\n  <section id=\"demo\" style=\"position:relative; z-index:1; padding:70px 64px 90px; max-width:1240px; margin:0 auto;\">\n    <div class=\"reveal\" style=\"border-radius:26px; padding:42px; background:linear-gradient(160deg,rgba(20,18,38,0.9),rgba(12,11,24,0.95)); border:1px solid rgba(255,255,255,0.08); box-shadow:0 30px 80px rgba(0,0,0,0.5); overflow:hidden; position:relative;\">\n      <div style=\"position:absolute; top:-40%; right:-10%; width:480px; height:480px; border-radius:50%; background:radial-gradient(circle,rgba(124,108,248,0.18),transparent 70%); pointer-events:none;\"><\u002Fdiv>\n      <div style=\"display:grid; grid-template-columns:0.85fr 1.15fr; gap:40px; align-items:center; position:relative;\">\n        <div>\n          <div style=\"font-size:13px; letter-spacing:0.18em; text-transform:uppercase; color:#7c6cf8; font-weight:600; margin-bottom:14px;\">Live preview<\u002Fdiv>\n          <h2 data-chars=\"true\" style=\"font-family:'Space Grotesk',sans-serif; font-size:clamp(26px,2.8vw,38px); font-weight:700; letter-spacing:-0.02em; margin:0 0 16px; cursor:default; white-space:nowrap;\">Beautiful charts, zero setup<\u002Fh2>\n          <p style=\"font-size:16px; line-height:1.6; color:#a9a8c4; margin:0 0 28px;\">Crisp, customizable output straight out of the box — no design skills required.<\u002Fp>\n          <a href=\"https://curve-craft.vercel.app/\" target=\"_blank\" style=\"display:inline-flex; align-items:center; gap:10px; background:linear-gradient(135deg,#7c6cf8,#9d7cff); color:#07070d; font-weight:700; font-size:15.5px; padding:14px 26px; border-radius:12px; text-decoration:none; box-shadow:0 10px 30px rgba(124,108,248,0.4);\">\n            Try it with your data\n            <svg width=\"17\" height=\"17\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M5 12h14M13 6l6 6-6 6\" stroke=\"#07070d\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n          <\u002Fa>\n        <\u002Fdiv>\n        <div style=\"background:rgba(7,7,13,0.6); border:1px solid rgba(255,255,255,0.08); border-radius:18px; padding:22px;\">\n          <div style=\"display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; flex-wrap:wrap; gap:10px;\">\n            <div style=\"font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:15px;\">Monthly revenue<\u002Fdiv>\n            <div ref=\"{{ demoTabsRef }}\" style=\"display:flex; gap:5px; padding:4px; border-radius:11px; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.08);\">\n              <button data-type=\"bars\" onclick=\"{{ setBars }}\" style=\"border:none; cursor:pointer; font-family:'Plus Jakarta Sans',sans-serif; font-size:12.5px; font-weight:600; padding:6px 13px; border-radius:8px; background:linear-gradient(135deg,#7c6cf8,#9d7cff); color:#07070d;\">Bars<\u002Fbutton>\n              <button data-type=\"points\" onclick=\"{{ setPoints }}\" style=\"border:none; cursor:pointer; font-family:'Plus Jakarta Sans',sans-serif; font-size:12.5px; font-weight:600; padding:6px 13px; border-radius:8px; background:transparent; color:#b9b8d0;\">Points<\u002Fbutton>\n              <button data-type=\"line\" onclick=\"{{ setLine }}\" style=\"border:none; cursor:pointer; font-family:'Plus Jakarta Sans',sans-serif; font-size:12.5px; font-weight:600; padding:6px 13px; border-radius:8px; background:transparent; color:#b9b8d0;\">Ribbon<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div ref=\"{{ demoStageRef }}\" style=\"position:relative; height:320px; width:100%; cursor:crosshair; border-radius:14px; overflow:hidden; background:radial-gradient(120% 90% at 50% 0%, rgba(124,108,248,0.10), transparent 60%);\">\n            <canvas ref=\"{{ demoCanvasRef }}\" style=\"position:absolute; inset:0; width:100%; height:100%;\"><\u002Fcanvas>\n            <div ref=\"{{ demoTipRef }}\" style=\"position:absolute; pointer-events:none; opacity:0; transform:translate(-50%,-118%); transition:opacity 0.15s; padding:7px 11px; border-radius:9px; background:rgba(10,9,20,0.92); border:1px solid rgba(124,108,248,0.4); box-shadow:0 8px 24px rgba(0,0,0,0.5); white-space:nowrap; z-index:3;\">\n              <div ref=\"{{ demoTipLabel }}\" style=\"font-size:11px; color:#8b8aa6;\">—<\u002Fdiv>\n              <div ref=\"{{ demoTipValue }}\" style=\"font-family:'Space Grotesk',sans-serif; font-size:15px; font-weight:700; color:#5eead4;\">—<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex; align-items:center; justify-content:space-between; margin-top:12px;\">\n            <div style=\"font-size:12px; color:#7a7995; display:flex; align-items:center; gap:7px;\">\n              <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M12 3v3m0 12v3M3 12h3m12 0h3M5.6 5.6l2.1 2.1m8.6 8.6l2.1 2.1m0-12.8l-2.1 2.1M7.7 16.3l-2.1 2.1\" stroke=\"#7a7995\" stroke-width=\"1.8\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg>\n              Hover a bar for details\n            <\u002Fdiv>\n            <button onclick=\"{{ shuffleData }}\" style=\"display:inline-flex; align-items:center; gap:7px; border:1px solid rgba(94,234,212,0.3); background:rgba(94,234,212,0.08); color:#5eead4; cursor:pointer; font-family:'Plus Jakarta Sans',sans-serif; font-size:12.5px; font-weight:600; padding:7px 13px; border-radius:9px;\">\n              <svg width=\"13\" height=\"13\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M3 7h4l3 5m11 0h-4l-3-5m7 12h-4l-2-3M3 17h4l2-3\" stroke=\"#5eead4\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><path d=\"M17 4l3 3-3 3M17 14l3 3-3 3\" stroke=\"#5eead4\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n              Shuffle data\n            <\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- CTA BANNER -->\n  <section style=\"position:relative; z-index:1; padding:30px 64px 0; max-width:1240px; margin:0 auto;\">\n    <div class=\"cta-banner reveal\" style=\"text-align:center; border-radius:26px; padding:64px 40px; background:linear-gradient(135deg,rgba(124,108,248,0.18),rgba(94,234,212,0.10)); border:1px solid rgba(124,108,248,0.25); box-shadow:0 30px 80px rgba(0,0,0,0.45);\">\n      <h2 data-chars=\"true\" style=\"font-family:'Space Grotesk',sans-serif; font-size:clamp(30px,4vw,52px); font-weight:700; letter-spacing:-0.025em; margin:0 0 18px; cursor:default; white-space:nowrap;\">Turn any CSV into a publication ready graph<\u002Fh2>\n      <p style=\"font-size:17px; color:#c4c3dc; margin:0 0 32px;\">Free, open-source, and running entirely in your browser.<\u002Fp>\n      <a href=\"https://curve-craft.vercel.app/\" target=\"_blank\" style=\"display:inline-flex; align-items:center; gap:10px; background:#fff; color:#07070d; font-weight:700; font-size:17px; padding:16px 34px; border-radius:14px; text-decoration:none; box-shadow:0 14px 40px rgba(124,108,248,0.4);\">\n        Open Curve Craft\n        <svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M5 12h14M13 6l6 6-6 6\" stroke=\"#07070d\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n      <\u002Fa>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- FOOTER -->\n  <footer style=\"position:relative; z-index:1; padding:50px 64px; max-width:1240px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; border-top:1px solid rgba(255,255,255,0.07); margin-top:60px; flex-wrap:wrap; gap:18px;\">\n    <div style=\"display:flex; align-items:center; gap:11px;\">\n      <div style=\"width:30px; height:30px; border-radius:8px; background:linear-gradient(135deg,#7c6cf8,#9d7cff); display:flex; align-items:center; justify-content:center;\">\n        <svg width=\"17\" height=\"17\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M3 17c3-1 4-9 7-9s4 7 7 4\" stroke=\"#fff\" stroke-width=\"2.4\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg>\n      <\u002Fdiv>\n      <span style=\"font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:16px;\">Curve Craft<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"font-size:13.5px; color:#7a7995;\">Open-source · Runs locally · No data leaves your machine<\u002Fdiv>\n    <div style=\"display:flex; gap:22px; font-size:14px; color:#a9a8c4;\">\n      <a href=\"https://curve-craft.vercel.app/\" target=\"_blank\" class=\"nav-lnk\" style=\"color:inherit; text-decoration:none;\">App<\u002Fa>\n      <a href=\"#features\" class=\"nav-lnk\" style=\"color:inherit; text-decoration:none;\">Features<\u002Fa>\n      <a href=\"#how\" class=\"nav-lnk\" style=\"color:inherit; text-decoration:none;\">How it works<\u002Fa>\n    <\u002Fdiv>\n  <\u002Ffooter>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.demoStageRef = React.createRef();\n    this.demoCanvasRef= React.createRef();\n    this.demoTabsRef  = React.createRef();\n    this.demoTipRef   = React.createRef();\n    this.demoTipLabel = React.createRef();\n    this.demoTipValue = React.createRef();\n    this.demoMonths = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug'];\n    this.demoData   = [42,58,51,73,64,88,79,95];\n    this.demoType   = 'bars';\n  }\n\n  renderVals() {\n    return {\n      demoStageRef: this.demoStageRef, demoCanvasRef: this.demoCanvasRef,\n      demoTabsRef: this.demoTabsRef, demoTipRef: this.demoTipRef,\n      demoTipLabel: this.demoTipLabel, demoTipValue: this.demoTipValue,\n      setBars:     () => this._setType('bars'),\n      setPoints:   () => this._setType('points'),\n      setLine:     () => this._setType('line'),\n      shuffleData: () => this._shuffle(),\n    };\n  }\n\n  componentDidMount() {\n    /* cursor */\n    this._dot  = document.getElementById('cursor-dot');\n    this._ring = document.getElementById('cursor-ring');\n    this._glow = document.getElementById('cursor-glow');\n    this._cx = window.innerWidth/2; this._cy = window.innerHeight/2;\n    this._rx = this._cx; this._ry = this._cy;\n    this._cVisible = false;\n    document.addEventListener('mousemove',  this._onMove);\n    document.addEventListener('mouseleave', this._onLeave);\n    document.addEventListener('mouseenter', this._onEnter);\n    this._cRaf = requestAnimationFrame(this._tick);\n\n    /* 3D text interactions */\n    setTimeout(() => { this._initChars(); this._initTilts(); this._initFlips(); }, 120);\n\n    /* scroll reveals */\n    this._observe();\n\n    /* Demo 2D */\n    setTimeout(() => this._initDemo2D(), 120);\n  }\n\n  componentWillUnmount() {\n    document.removeEventListener('mousemove',  this._onMove);\n    document.removeEventListener('mouseleave', this._onLeave);\n    document.removeEventListener('mouseenter', this._onEnter);\n    cancelAnimationFrame(this._cRaf);\n    cancelAnimationFrame(this._demoRaf);\n  }\n\n  /* ── cursor ── */\n  _onMove = (e) => {\n    this._cx = e.clientX; this._cy = e.clientY;\n    if (!this._cVisible) {\n      this._rx = e.clientX; this._ry = e.clientY;\n      this._cVisible = true;\n      if (this._dot)  this._dot.style.opacity  = '1';\n      if (this._ring) this._ring.style.opacity = '1';\n    }\n    const t = e.target.closest('a, button');\n    if (this._ring) {\n      this._ring.style.width       = t ? '52px' : '36px';\n      this._ring.style.height      = t ? '52px' : '36px';\n      this._ring.style.borderColor = t ? 'rgba(94,234,212,0.65)' : 'rgba(124,108,248,0.5)';\n    }\n  };\n  _onLeave = () => { this._cVisible=false; if(this._dot) this._dot.style.opacity='0'; if(this._ring) this._ring.style.opacity='0'; };\n  _onEnter = () => { if(this._cx!==undefined && this._cVisible===false){ this._cVisible=true; if(this._dot) this._dot.style.opacity='1'; if(this._ring) this._ring.style.opacity='1'; } };\n  _tick = () => {\n    this._cRaf = requestAnimationFrame(this._tick);\n    if (!this._cVisible) return;\n    this._rx += (this._cx - this._rx) * 0.14;\n    this._ry += (this._cy - this._ry) * 0.14;\n    if (this._dot)  { this._dot.style.left  = this._cx+'px'; this._dot.style.top  = this._cy+'px'; }\n    if (this._ring) { this._ring.style.left = this._rx+'px'; this._ring.style.top = this._ry+'px'; }\n    if (this._glow) {\n      this._glow.style.background =\n        `radial-gradient(600px circle at ${this._cx}px ${this._cy}px, rgba(124,108,248,0.13) 0%, rgba(94,234,212,0.06) 35%, transparent 65%)`;\n    }\n  };\n\n  /* ── scroll reveal ── */\n  _observe() {\n    const io = new IntersectionObserver((entries) => {\n      entries.forEach((en) => { if (en.isIntersecting) en.target.classList.add('in'); });\n    }, { threshold: 0.12 });\n    setTimeout(() => { document.querySelectorAll('.reveal').forEach((el) => io.observe(el)); }, 150);\n  }\n\n  /* ── 3D char wave ── */\n  _initChars() {\n    document.querySelectorAll('[data-chars]').forEach((el) => {\n      const wrapNode = (node) => {\n        if (node.nodeType === 3) {\n          const frag = document.createDocumentFragment();\n          [...node.textContent].forEach((c) => {\n            if (c === ' ' || c === '\\u00a0') { frag.appendChild(document.createTextNode('\\u00a0')); return; }\n            const s = document.createElement('span'); s.className='ch'; s.textContent=c; frag.appendChild(s);\n          });\n          node.parentNode.replaceChild(frag, node);\n        } else if (node.nodeType===1 && node.tagName!=='SCRIPT') {\n          [...node.childNodes].forEach(wrapNode);\n        }\n      };\n      [...el.childNodes].forEach(wrapNode);\n      el.addEventListener('mousemove', (e) => {\n        el.querySelectorAll('.ch').forEach((s) => {\n          const r=s.getBoundingClientRect(); if(!r.width) return;\n          const dx=e.clientX-(r.left+r.width/2), dy=e.clientY-(r.top+r.height/2);\n          const dist=Math.sqrt(dx*dx+dy*dy), maxD=88, f=Math.max(0,1-dist/maxD);\n          if (f>0.02) {\n            s.style.transform=`perspective(200px) translateZ(${f*24}px) rotateX(${-(dy/maxD)*f*26}deg) rotateY(${(dx/maxD)*f*26}deg)`;\n            s.style.color=`rgb(${Math.round(157+f*98)},${Math.round(124+f*131)},${Math.round(255-f*45)})`;\n            s.style.filter=`drop-shadow(0 0 ${Math.round(f*14)}px rgba(124,108,248,0.9))`;\n          } else { s.style.transform=''; s.style.color=''; s.style.filter=''; }\n        });\n      });\n      el.addEventListener('mouseleave', () => {\n        el.querySelectorAll('.ch').forEach((s) => { s.style.transform=''; s.style.color=''; s.style.filter=''; });\n      });\n    });\n  }\n\n  /* ── perspective tilt ── */\n  _initTilts() {\n    document.querySelectorAll('[data-tilt]').forEach((el) => {\n      el.addEventListener('mousemove', (e) => {\n        const r=el.getBoundingClientRect();\n        const px=(e.clientX-r.left)/r.width-0.5, py=(e.clientY-r.top)/r.height-0.5;\n        el.style.transform=`perspective( aseY = () => h - 30, maxH = () => h * 0.72;\n    const slotW = () => (w - pad * 2) / n;\n    const bxFor  = (i) => pad + i * slotW() + slotW() / 2;\n    const byFor  = (i) => baseY() - (current[i] / 100) * maxH();\n    let type = 'bars';\n\n    this._demoSetData   = (data) => { for (let i=0;i<n;i++) target[i]=data[i]; };\n    this._demoApplyType = (t)    => { type = t; };\n\n    const tip  = this.demoTipRef.current;\n    const tipL = this.demoTipLabel.current;\n    const tipV = this.demoTipValue.current;\n\n    const onMove = (e) => {\n      const r = stage.getBoundingClientRect();\n      const mx = e.clientX - r.left, my = e.clientY - r.top;\n      let best = 999, bi = -1;\n      for (let i = 0; i < n; i++) {\n        const d = Math.abs(mx - bxFor(i));\n        if (d < best) { best = d; bi = i; }\n      }\n      hoverIdx = best < slotW() * 0.7 ? bi : -1;\n      if (hoverIdx >= 0 && tip) {\n        tip.style.opacity = '1';\n        tip.style.left = bxFor(hoverIdx) + 'px';\n        tip.style.top  = byFor(hoverIdx) + 'px';\n        tipL.textContent = this.demoMonths[hoverIdx];\n        tipV.textContent = '$' + Math.round(this.demoData[hoverIdx]) + 'k';\n      } else if (tip) tip.style.opacity = '0';\n    };\n    const onLeave = () => { hoverIdx = -1; if (tip) tip.style.opacity = '0'; };\n    stage.addEventListener('pointermove', onMove);\n    stage.addEventListener('pointerleave', onLeave);\n\n    const t0 = Date.now();\n    const draw = () => {\n      this._demoRaf = requestAnimationFrame(draw);\n      const t = (Date.now() - t0) / 1000;\n      ctx.clearRect(0, 0, w, h);\n      for (let i = 0; i < n; i++) current[i] += (target[i] - current[i]) * 0.09;\n\n      const bw = slotW() * 0.52;\n\n      /* grid */\n      ctx.strokeStyle = 'rgba(255,255,255,0.06)'; ctx.lineWidth = 1;\n      for (let g = 1; g <= 4; g++) {\n        const gy = baseY() - (g / 4) * maxH();\n        ctx.beginPath(); ctx.moveTo(pad, gy); ctx.lineTo(w - pad, gy); ctx.stroke();\n      }\n\n      /* bars */\n      if (type === 'bars' || type === 'line') {\n        for (let i = 0; i < n; i++) {\n          const norm = current[i] / 100;\n          const col  = lerpC(purple, teal, norm);\n          const isH  = i === hoverIdx;\n          const breathe = 1 + Math.sin(t * 1.6 + i * 0.45) * 0.018;\n          const bh = (current[i] / 100) * maxH() * (type === 'line' ? 0.3 : breathe);\n          const bww = isH ? bw * 1.1 : bw;\n          const x = bxFor(i) - bww / 2, y = baseY() - bh;\n          const r = 5;\n          const grad = ctx.createLinearGradient(bxFor(i), y, bxFor(i), baseY());\n          grad.addColorStop(0, `rgba(${col.join(',')},${isH ? 0.95 : type === 'line' ? 0.28 : 0.72})`);\n          grad.addColorStop(1, `rgba(${col.join(',')},0.06)`);\n          ctx.beginPath();\n          ctx.moveTo(x + r, y); ctx.lineTo(x + bww - r, y);\n          ctx.quadraticCurveTo(x + bww, y, x + bww, y + r);\n          ctx.lineTo(x + bww, baseY()); ctx.lineTo(x, baseY());\n          ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y);\n          ctx.closePath(); ctx.fillStyle = grad; ctx.fill();\n          if (isH && type === 'bars') {\n            ctx.strokeStyle = `rgba(${col.join(',')},0.7)`; ctx.lineWidth = 1.5; ctx.stroke();\n            ctx.shadowColor = `rgba(${col.join(',')},0.5)`; ctx.shadowBlur = 18; ctx.fill(); ctx.shadowBlur = 0;\n          }\n        }\n      }\n\n      /* bezier line + area */\n      if (type === 'line' || type === 'bars') {\n        const pts = Array.from({ length: n }, (_, i) => [bxFor(i), byFor(i)]);\n        /* area */\n        if (type === 'line') {\n          ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);\n          for (let i = 1; i < n; i++) { const cx=(pts[i-1][0]+pts[i][0])/2; ctx.bezierCurveTo(cx,pts[i-1][1],cx,pts[i][1],pts[i][0],pts[i][1]); }\n          ctx.lineTo(pts[n-1][0], baseY()); ctx.lineTo(pts[0][0], baseY()); ctx.closePath();\n          const ag = ctx.createLinearGradient(0, 0, w, 0);\n          ag.addColorStop(0,'rgba(124,108,248,0.22)'); ag.addColorStop(1,'rgba(94,234,212,0.10)');\n          ctx.fillStyle = ag; ctx.fill();\n        }\n        /* stroke */\n        ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);\n        for (let i = 1; i < n; i++) { const cx=(pts[i-1][0]+pts[i][0])/2; ctx.bezierCurveTo(cx,pts[i-1][1],cx,pts[i][1],pts[i][0],pts[i][1]); }\n        const lg = ctx.createLinearGradient(pad, 0, w-pad, 0);\n        lg.addColorStop(0,'#7c6cf8'); lg.addColorStop(1,'#5eead4');\n        ctx.strokeStyle = lg; ctx.lineWidth = type==='line'?2.8:1.5; ctx.lineJoin='round'; ctx.lineCap='round';\n        ctx.shadowColor='rgba(124,108,248,0.4)'; ctx.shadowBlur=8; ctx.stroke(); ctx.shadowBlur=0;\n        /* dots */\n        for (let i = 0; i < n; i++) {\n          const norm=current[i]/100, col=lerpC(purple,teal,norm), isH=i===hoverIdx, r=isH?7:4;\n          ctx.beginPath(); ctx.arc(pts[i][0],pts[i][1],r,0,Math.PI*2);\n          ctx.fillStyle=`rgb(${col.join(',')})`;\n          if(isH){ctx.shadowColor=`rgba(${col.join(',')},0.8)`;ctx.shadowBlur=16;}\n          ctx.fill(); ctx.shadowBlur=0;\n          ctx.strokeStyle='rgba(7,7,13,0.8)'; ctx.lineWidth=1.5; ctx.stroke();\n        }\n      }\n\n      /* scatter dots */\n      if (type === 'points') {\n        for (let i = 0; i < n; i++) {\n          const norm=current[i]/100, col=lerpC(purple,teal,norm), isH=i===hoverIdx;\n          const breathe=1+Math.sin(t*2+i*0.7)*0.07;\n          const r=(isH?15:10)*breathe;\n          const rg=ctx.createRadialGradient(bxFor(i),byFor(i),0,bxFor(i),byFor(i),r*2.4);\n          rg.addColorStop(0,`rgba(${col.join(',')},0.38)`); rg.addColorStop(1,`rgba(${col.join(',')},0)`);\n          ctx.beginPath(); ctx.arc(bxFor(i),byFor(i),r*2.4,0,Math.PI*2);\n          ctx.fillStyle=rg; ctx.fill();\n          ctx.beginPath(); ctx.arc(bxFor(i),byFor(i),r,0,Math.PI*2);\n          ctx.fillStyle=`rgb(${col.join(',')})`;\n          if(isH){ctx.shadowColor=`rgba(${col.join(',')},0.8)`;ctx.shadowBlur=18;}\n          ctx.fill(); ctx.shadowBlur=0;\n          ctx.strokeStyle='rgba(7,7,13,0.6)'; ctx.lineWidth=2; ctx.stroke();\n        }\n      }\n\n      /* x labels */\n      ctx.fillStyle='rgba(122,121,149,0.85)'; ctx.font='11px Plus Jakarta Sans,sans-serif'; ctx.textAlign='center';\n      for (let i = 0; i < n; i++) ctx.fillText(this.demoMonths[i], bxFor(i), baseY()+18);\n    };\n    draw();\n\n    const onResize = () => {\n      w=stage.clientWidth; h=stage.clientHeight;\n      canvas.width=w*dpr; canvas.height=h*dpr; ctx.scale(dpr,dpr);\n    };\n    window.addEventListener('resize', onResize);\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
